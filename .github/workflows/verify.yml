name: Verify state estimation and reproduce
on: [push, pull_request, workflow_dispatch]
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify preserved archive
        run: python scripts/verify_results.py
      - name: Tests and independent fresh study
        run: python scripts/run_study.py --output-dir build/ci --runs 20 --samples 3
      - name: CLI smoke
        run: python -m tracking --configuration sparse_measurements --seed 20261121 --output build/cli.json
      - uses: actions/upload-artifact@v4
        with:
          name: kalman-reproduction
          path: build/ci
